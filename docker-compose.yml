networks:
  control-plane-net:
    driver: bridge
  pci-data-plane-net:
    driver: bridge

volumes:
  pgdata:
    driver: local

services:
  # 1. PostgreSQL Database with Full-Text Search (Business records, tokens, audit logs, knowledge base)
  postgres:
    image: ankane/pgvector:v0.5.1
    container_name: zytasafe-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zytasafe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zytasafe_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-zytasafe_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - control-plane-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-zytasafe} -d $${POSTGRES_DB:-zytasafe_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. LiveKit Media Server (WebRTC Voice Routing & Severance)
  livekit:
    image: livekit/livekit-server:v1.6.0
    container_name: zytasafe-livekit
    command: ["--dev", "--bind", "0.0.0.0", "--keys", "${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-secret}"]
    ports:
      - "7880:7880"       # Signaling & HTTP
      - "7881:7881"       # WebRTC TCP
      - "7882:7882/udp"   # WebRTC UDP
    networks:
      - control-plane-net
      - pci-data-plane-net
    restart: unless-stopped

  # 3. Isolated Payment Microservice (Zero-Trust Data Plane - Meta Model Ecosystem)
  payment-service:
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    container_name: zytasafe-payment-service
    ports:
      - "8001:8001"
    environment:
      - PYTHONUNBUFFERED=1
      - PCI_SCOPE=ISOLATED
      - LIVEKIT_URL=${LIVEKIT_URL:-http://livekit:7880}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-devkey}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-secret}
      - META_STT_ENGINE=${META_STT_ENGINE:-spark_open_audio}
      - META_TTS_MODEL=${META_TTS_MODEL:-facebook/mms-tts-eng}
    read_only: true # Enforce read-only filesystem for PCI compliance
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    volumes:
      - ./payment-service/app:/app/app:ro
    networks:
      - pci-data-plane-net
      - control-plane-net
    depends_on:
      - livekit
    restart: unless-stopped

  # 4. Control Plane Backend (FastAPI, CRM, Copilot, Audit Trail - Muse Spark Open)
  copilot-backend:
    build:
      context: ./copilot-app/backend
      dockerfile: Dockerfile
    container_name: zytasafe-copilot-backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://${POSTGRES_USER:-zytasafe}:${POSTGRES_PASSWORD:-zytasafe_secure_pass}@postgres:5432/${POSTGRES_DB:-zytasafe_db}
      - PAYMENT_SERVICE_URL=http://payment-service:8001
      - LIVEKIT_URL=${LIVEKIT_URL:-http://livekit:7880}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-devkey}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-secret}
      - COPILOT_PROVIDER=${COPILOT_PROVIDER:-spark_open}
      - API_ACTIVE=${API_ACTIVE:-false}
      - BASETEN_API_KEY=${BASETEN_API_KEY:-}
      - BASETEN_SPARK_OPEN_URL=${BASETEN_SPARK_OPEN_URL:-}
    volumes:
      - ./copilot-app/backend/app:/app/app
    depends_on:
      postgres:
        condition: service_healthy
      livekit:
        condition: service_started
      payment-service:
        condition: service_started
    networks:
      - control-plane-net
    restart: unless-stopped

  # 5. Control Plane Frontend (React + Vite Desktop)
  copilot-frontend:
    build:
      context: ./copilot-app/frontend
      dockerfile: Dockerfile
    container_name: zytasafe-copilot-frontend
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://copilot-backend:8000
      - PAYMENT_URL=http://payment-service:8001
    volumes:
      - ./copilot-app/frontend/src:/app/src
      - ./copilot-app/frontend/public:/app/public
      - ./copilot-app/frontend/index.html:/app/index.html
      - ./copilot-app/frontend/tailwind.config.js:/app/tailwind.config.js
      - ./copilot-app/frontend/vite.config.js:/app/vite.config.js
    depends_on:
      - copilot-backend
      - payment-service
    networks:
      - control-plane-net
    restart: unless-stopped
